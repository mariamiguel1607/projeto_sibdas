<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamentos | TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="equipamentos.html" class="nav-link active">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="../localizacoes/localizacoes.html" class="nav-link">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="../garantias_contratos/garantias_contratos.html" class="nav-link">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-lg-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1">Adicionar Equipamento</h1>
                    <p class="text-muted mb-0">
                        Registo de um novo equipamento médico na plataforma.
                    </p>
                </div>

                <a href="equipamentos.html" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Voltar
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-lg-5">

                    <form>

                        <h4 class="fw-bold mb-4">Dados principais</h4>

                        <div class="row g-4">

                            <div class="col-md-4">
                                <label for="codigo" class="form-label fw-bold">Código interno</label>
                                <input type="text" class="form-control" id="codigo" placeholder="Ex: EQ-0006">
                            </div>

                            <div class="col-md-8">
                                <label for="designacao" class="form-label fw-bold">Designação do equipamento</label>
                                <input type="text" class="form-control" id="designacao"
                                    placeholder="Ex: Monitor Multiparamétrico">
                            </div>

                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-bold">Categoria</label>
                                <select id="categoria" class="form-select">
                                    <option selected disabled>Selecionar categoria</option>
                                    <option>Suporte de vida</option>
                                    <option>Monitorização</option>
                                    <option>Diagnóstico</option>
                                    <option>Terapia</option>
                                    <option>Imagem médica</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="fabricante" class="form-label fw-bold">Fabricante</label>
                                <input type="text" class="form-control" id="fabricante" placeholder="Ex: Philips">
                            </div>

                            <div class="col-md-6">
                                <label for="marca" class="form-label fw-bold">Marca</label>
                                <input type="text" class="form-control" id="marca" placeholder="Ex: Philips">
                            </div>

                            <div class="col-md-6">
                                <label for="modelo" class="form-label fw-bold">Modelo</label>
                                <input type="text" class="form-control" id="modelo" placeholder="Ex: VX-200">
                            </div>

                            <div class="col-md-6">
                                <label for="serie" class="form-label fw-bold">Número de série</label>
                                <input type="text" class="form-control" id="serie" placeholder="Ex: SN-2026-001">
                            </div>

                            <div class="col-md-6">
                                <label for="ano" class="form-label fw-bold">Ano de fabrico</label>
                                <input type="number" class="form-control" id="ano" placeholder="Ex: 2023">
                            </div>

                        </div>

                        <hr class="my-5">

                        <h4 class="fw-bold mb-4">Aquisição e estado</h4>

                        <div class="row g-4">

                            <div class="col-md-4">
                                <label for="data" class="form-label fw-bold">Data de aquisição</label>
                                <input type="date" class="form-control" id="data">
                            </div>

                            <div class="col-md-4">
                                <label for="custo" class="form-label fw-bold">Custo de aquisição</label>
                                <input type="number" class="form-control" id="custo" placeholder="Ex: 2500">
                            </div>

                            <div class="col-md-4">
                                <label for="tipoEntrada" class="form-label fw-bold">Tipo de entrada</label>
                                <select id="tipoEntrada" class="form-select">
                                    <option selected disabled>Selecionar tipo</option>
                                    <option>Compra</option>
                                    <option>Doação</option>
                                    <option>Aluguer</option>
                                    <option>Empréstimo</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="estado" class="form-label fw-bold">Estado atual</label>
                                <select id="estado" class="form-select">
                                    <option selected disabled>Selecionar estado</option>
                                    <option>Ativo</option>
                                    <option>Inativo</option>
                                    <option>Em manutenção</option>
                                    <option>Em calibração</option>
                                    <option>Arquivado</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="criticidade" class="form-label fw-bold">Criticidade</label>
                                <select id="criticidade" class="form-select">
                                    <option selected disabled>Selecionar criticidade</option>
                                    <option>Baixa</option>
                                    <option>Média</option>
                                    <option>Alta</option>
                                    <option>Crítica</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="observacoes" class="form-label fw-bold">Observações</label>
                                <textarea id="observacoes" class="form-control" rows="4"
                                    placeholder="Observações adicionais sobre o equipamento"></textarea>
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-3 mt-5">
                            <a href="equipamentos.html" class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary-custom">
                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                Guardar Equipamento
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
