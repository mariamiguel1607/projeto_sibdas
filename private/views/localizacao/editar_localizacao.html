<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizaçãos | TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="../equipamentos/equipamentos.html" class="nav-link">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="localizacao.html" class="nav-link active">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="../garantias_contratos/garantias_contratos.html" class="nav-link">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-lg-5">

            <!-- CABEÇALHO -->
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">

                <div>

                    <h1 class="fw-bold mb-1">
                        Editar Localização
                    </h1>

                    <p class="text-muted mb-0">
                        Atualização da informação associada à localização física.
                    </p>

                </div>

                <div class="d-flex gap-2">

                    <a href="localizacao.html" class="btn btn-outline-secondary">

                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Voltar

                    </a>
                </div>

            </div>


            <!-- FORMULÁRIO -->
            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-lg-5">

                    <form>

                        <!-- DADOS DA LOCALIZAÇÃO -->
                        <h4 class="fw-bold mb-4">

                            <i class="fa-solid fa-location-dot me-2 text-primary"></i>
                            Dados da localização

                        </h4>

                        <div class="row g-4">

                            <!-- Código -->
                            <div class="col-md-6">

                                <label for="codigoLocalizacao" class="form-label fw-bold">

                                    Código da Localização

                                </label>

                                <input type="text" id="codigoLocalizacao" class="form-control" value="LOC-001">

                            </div>

                            <!-- Estado -->
                            <div class="col-md-6">

                                <label for="estadoLocalizacao" class="form-label fw-bold">

                                    Estado

                                </label>

                                <select id="estadoLocalizacao" class="form-select">

                                    <option selected>
                                        Ativa
                                    </option>

                                    <option>
                                        Em manutenção
                                    </option>

                                    <option>
                                        Inativa
                                    </option>

                                </select>

                            </div>

                            <!-- Edifício -->
                            <div class="col-md-6">

                                <label for="edificio" class="form-label fw-bold">

                                    Edifício

                                </label>

                                <select id="edificio" class="form-select">

                                    <option selected>
                                        Hospital Central
                                    </option>

                                    <option>
                                        Clínica Norte
                                    </option>

                                    <option>
                                        Bloco Operatório
                                    </option>

                                </select>

                            </div>

                            <!-- Piso -->
                            <div class="col-md-6">

                                <label for="piso" class="form-label fw-bold">

                                    Piso

                                </label>

                                <select id="piso" class="form-select">

                                    <option>
                                        Piso 0
                                    </option>

                                    <option>
                                        Piso 1
                                    </option>

                                    <option selected>
                                        Piso 2
                                    </option>

                                    <option>
                                        Piso 3
                                    </option>

                                </select>

                            </div>

                            <!-- Departamento -->
                            <div class="col-md-6">

                                <label for="departamento" class="form-label fw-bold">

                                    Departamento

                                </label>

                                <select id="departamento" class="form-select">

                                    <option selected>
                                        Unidade de Cuidados Intensivos
                                    </option>

                                    <option>
                                        Cardiologia
                                    </option>

                                    <option>
                                        Radiologia
                                    </option>

                                </select>

                            </div>

                            <!-- Sala -->
                            <div class="col-md-6">

                                <label for="sala" class="form-label fw-bold">

                                    Sala / Gabinete

                                </label>

                                <input type="text" id="sala" class="form-control" value="UCI-02">

                            </div>

                        </div>


                        <!-- OBSERVAÇÕES -->
                        <hr class="my-5">

                        <h4 class="fw-bold mb-4">

                            <i class="fa-solid fa-note-sticky me-2 text-primary"></i>
                            Observações

                        </h4>

                        <div class="mb-4">

                            <textarea class="form-control" rows="5"
                                placeholder="Observações adicionais sobre a localização">Localização utilizada para equipamentos críticos associados à unidade de cuidados intensivos.</textarea>

                        </div>


                        <!-- BOTÕES -->
                        <div class="d-flex justify-content-end gap-3 mt-5">

                            <a href="localizacao.html" class="btn btn-outline-secondary">

                                Cancelar

                            </a>

                            <button type="submit" class="btn btn-primary-custom">

                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                Guardar Alterações

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/1241375.js"></script>
</body>

</html>
