<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início de Sessão | TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../../assets/bootstrap/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../assets/css/1241375.css">
</head>

<body class="login-body">

    <main class="login-page">

        <div class="login-card">

            <!-- Logo e título -->
            <div class="text-center mb-4">
                <a href="../../public/index.html">
                    <img src="../../assets/images/imagem_logo1.png" alt="Logo TechMed Solutions" class="login-logo">
                </a>

                <h1 class="fw-bold mt-4 mb-2">Início de Sessão</h1>

                <p class="text-muted mb-0">
                    Aceda à área reservada da TechMed Solutions.
                </p>
            </div>

            <!-- Formulário de login -->
            <form id="loginForm" novalidate>

                <!-- Nome de utilizador -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">
                        Email
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>

                        <input type="email" id="email" name="email" class="form-control" placeholder="Insira o email">
                    </div>
                </div>

                <!-- Palavra-passe -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">
                        Palavra-passe
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Insira a palavra-passe">
                    </div>

                    <!-- Mensagem de erro -->
                    <div id="loginErro" class="text-danger small mt-2 d-none"></div>
                </div>

                <!-- Esqueceu-se da palavra-passe -->
                <div class="d-flex justify-content-end mb-4">
                    <a href="#" class="forgot-link">
                        Esqueceu-se da palavra-passe?
                    </a>
                </div>

                <!-- Botão entrar -->
                <button type="submit" class="btn btn-primary-custom w-100">
                    Entrar
                </button>

            </form>

            <!-- Voltar à página pública -->
            <div class="text-center mt-4">
                <a href="../../public/index.html" class="back-public-link">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Voltar à página pública
                </a>
            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script src="../../assets/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- Java Script -->
    <script src="../../assets/js/1241375.js"></script>

</body>

</html>
