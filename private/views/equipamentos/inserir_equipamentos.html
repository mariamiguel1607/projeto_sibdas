            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1">Adicionar Equipamento</h1>
                    <p class="text-muted mb-0">
                        Registo de um novo equipamento médico na plataforma.
                    </p>
                </div>

                <a href="equipamentos.html" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Voltar
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-lg-5">

                    <form>

                        <div class="card border-0 shadow-sm rounded-4">

                            <div class="card-body p-4">

                                <ul class="nav nav-pills conteudos-tabs mb-4">

                                    <li class="nav-item">
                                        <button type="button" class="nav-link active" data-bs-toggle="pill"
                                            data-bs-target="#dadosGeraisNovo">
                                            Dados Gerais
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#aquisicaoNovo">

                                            Aquisição

                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#localizacaoNovo">
                                            Localização
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#fornecedorNovo">
                                            Fornecedor
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#garantiasNovo">

                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"

                                            Documentação
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#manutencaoNovo">
                                            Manutenção
                                        </button>
                                    </li>

                                    <li class="nav-item">
                                        <button type="button" class="nav-link" data-bs-toggle="pill"
                                            data-bs-target="#observacoesNovo">
                                            Observações
                                        </button>
                                    </li>



                                </ul>

                                <div class="tab-content">

                                    <div class="tab-pane fade show active" id="dadosGeraisNovo">

                                        <div class="row g-4">

                                            <div class="col-md-4">
                                                <label class="form-label fw-bold">Código Interno</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-8">
                                                <label class="form-label fw-bold">Designação</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Categoria</label>
                                                <select class="form-select">
                                                    <option selected disabled>Selecionar categoria</option>
                                                    <option>Suporte de Vida</option>
                                                    <option>Monitorização</option>
                                                    <option>Diagnóstico</option>
                                                    <option>Terapia</option>
                                                </select>
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Fabricante</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Marca</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Modelo</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Número de Série</label>
                                                <input type="text" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Ano de Fabrico</label>
                                                <input type="number" class="form-control">
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Estado</label>
                                                <select class="form-select">
                                                    <option>Ativo</option>
                                                    <option>Inativo</option>
                                                    <option>Em manutenção</option>
                                                </select>
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label fw-bold">Criticidade</label>
                                                <select class="form-select">
                                                    <option>Baixa</option>
                                                    <option>Média</option>
                                                    <option>Alta</option>
                                                    <option>Crítica</option>
                                                </select>
                                            </div>

                                        </div>

                                    </div>

                                            <div class="col-md-3">

                                                <label class="form-label fw-bold">

                                                </label>

                                                <input type="date" class="form-control">

                                            </div>

                                            <div class="col-md-3">

                                                <label class="form-label fw-bold">
                                                    Custo de Aquisição (€)
                                                </label>

                                                <input type="number" class="form-control" min="0" step="0.01"
                                                    placeholder="0.00">

                                            </div>

                                            <div class="col-md-3">

                                                <label class="form-label fw-bold">
                                                    Tipo de Entrada
                                                </label>

                                                <select class="form-select">

                                                    <option selected disabled>
                                                        Selecionar tipo
                                                    </option>

                                                    <option>
                                                        Compra
                                                    </option>

                                                    <option>
                                                        Doação
                                                    </option>

                                                    <option>
                                                        Aluguer
                                                    </option>

                                                    <option>
                                                        Empréstimo
                                                    </option>

                                                </select>

                                            </div>

                                            <div class="col-md-3">

                                                <label class="form-label fw-bold">
                                                    Estado Inicial
                                                </label>

                                                <select class="form-select">

                                                    <option selected>
                                                        Ativo
                                                    </option>

                                                    <option>
                                                        Em manutenção
                                                    </option>

                                                    <option>
                                                        Inativo
                                                    </option>

                                                </select>

                                            </div>

                                        </div>

                                    </div>
                                    <!-- Localização -->
                                    <div class="tab-pane fade" id="localizacaoNovo">

                                        </label>

                                        <select class="form-select">

                                            <option selected disabled>
                                                Selecionar localização
                                            </option>

                                            <option>
                                                UCI - Piso 2 - Sala UCI02
                                            </option>

                                            <option>
                                                Urgência - Piso 1
                                            </option>

                                            <option>
                                                Bloco Operatório
                                            </option>

                                        </select>

                                    </div>

                                    <div class="tab-pane fade" id="fornecedorNovo">

                                        <label class="form-label fw-bold">

                                        </label>

                                            <option selected disabled>
                                                Selecionar fornecedor
                                            </option>

                                            <option>
                                                MedEquip Portugal
                                            </option>

                                            <option>
                                                SaúdeTec Lda.
                                            </option>

                                            <option>
                                                HospitalCare Solutions
                                            </option>

                                        </select>

                                    </div>

                                            <div class="col-md-6">

                                                <label class="form-label fw-bold">
                                                    Garantia Associada
                                                </label>

                                                    <option selected disabled>
                                                        Selecionar garantia
                                                    </option>

                                                </select>

                                            </div>

                                            <div class="col-md-6">

                                                <label class="form-label fw-bold">
                                                    Contrato Associado
                                                </label>

                                                <select class="form-select">

                                                    <option selected disabled>
                                                        Selecionar contrato
                                                    </option>

                                                </select>

                                            </div>

                                        </div>

                                    </div>

                                    <div class="tab-pane fade" id="documentacaoNovo">

                                        <label class="form-label fw-bold">
                                            Documentação Associada
                                        </label>

                                        <select class="form-select">

                                            <option selected disabled>
                                                Selecionar documento
                                            </option>

                                            <option>
                                                Manual de Utilização
                                            </option>

                                            <option>
                                                Certificado CE
                                            </option>

                                            <option>
                                                Relatório de Calibração
                                            </option>

                                        </select>

                                    </div>

                                    <div class="tab-pane fade" id="manutencaoNovo">

                                        <div class="row g-4">

                                            <div class="col-md-6">

                                                <label class="form-label fw-bold">
                                                    Próxima Manutenção
                                                </label>

                                                <input type="date" class="form-control">

                                            </div>

                                            <div class="col-md-6">

                                                <label class="form-label fw-bold">
                                                    Próxima Calibração
                                                </label>

                                                <input type="date" class="form-control">

                                            </div>

                                        </div>

                                    </div>

                                    <div class="tab-pane fade" id="observacoesNovo">

                                        <label class="form-label fw-bold">
                                            Observações
                                        </label>

                                    </div>

                                        <i class="fa-solid fa-floppy-disk me-2"></i>
                                        Guardar Equipamento

                                    </button>

                                </div>

                            </div>
