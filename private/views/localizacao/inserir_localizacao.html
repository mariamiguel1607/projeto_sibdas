<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizaçãos | TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="../equipamentos/equipamentos.html" class="nav-link">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="localizacao.html" class="nav-link active">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="../garantias_contratos/garantias_contratos.html" class="nav-link">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-lg-5">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1 class="fw-bold mb-1">
                        Adicionar Localização
                    </h1>

                    <p class="text-muted mb-0">
                        Registo de uma nova localização física na plataforma.
                    </p>

                </div>

                <a href="localizacao.html" class="btn btn-outline-secondary">

                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Voltar

                </a>

            </div>

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-lg-5">

                    <form>

                        <!-- DADOS PRINCIPAIS -->
                        <h4 class="fw-bold mb-4">
                            Dados principais
                        </h4>

                        <div class="row g-4">

                            <!-- Código -->
                            <div class="col-md-4">

                                <label for="codigo" class="form-label fw-bold">
                                    Código da localização
                                </label>

                                <input type="text" class="form-control" id="codigo" placeholder="Ex: LOC-0006">

                            </div>

                            <!-- Edifício -->
                            <div class="col-md-8">

                                <label for="edificio" class="form-label fw-bold">
                                    Edifício
                                </label>

                                <input type="text" class="form-control" id="edificio"
                                    placeholder="Ex: Hospital Central">

                            </div>

                            <!-- Piso -->
                            <div class=" col-md-4">

                                <label for="piso" class="form-label fw-bold">
                                    Piso
                                </label>

                                <input type="text" class="form-control" id="piso" placeholder="Ex: Piso 2">

                            </div>

                            <!-- Departamento -->
                            <div class="col-md-4">

                                <label for="departamento" class="form-label fw-bold">
                                    Departamento / Serviço
                                </label>

                                <input type="text" class="form-control" id="departamento" placeholder="Ex: Cardiologia">

                            </div>

                            <!-- Sala -->
                            <div class="col-md-4">

                                <label for="sala" class="form-label fw-bold">
                                    Sala / Gabinete
                                </label>

                                <input type="text" class="form-control" id="sala" placeholder="Ex: Sala 2.14">

                            </div>

                        </div>

                        <hr class="my-5">

                        <!-- ESTADO -->
                        <h4 class="fw-bold mb-4">
                            Estado e observações
                        </h4>

                        <div class="row g-4">

                            <!-- Estado -->
                            <div class="col-md-6">

                                <label for="estado" class="form-label fw-bold">
                                    Estado
                                </label>

                                <select id="estado" class="form-select">

                                    <option selected disabled>
                                        Selecionar estado
                                    </option>

                                    <option>Ativa</option>

                                    <option>Em manutenção</option>

                                    <option>Inativa</option>

                                </select>

                            </div>

                            <!-- Responsável -->
                            <div class="col-md-6">

                                <label for="responsavel" class="form-label fw-bold">
                                    Responsável
                                </label>

                                <input type="text" class="form-control" id="responsavel"
                                    placeholder="Ex: Eng. João Silva">

                            </div>

                            <!-- Observações -->
                            <div class="col-12">

                                <label for="observacoes" class="form-label fw-bold">
                                    Observações
                                </label>

                                <textarea id="observacoes" class="form-control" rows="4"
                                    placeholder="Observações adicionais sobre a localização"></textarea>

                            </div>

                        </div>

                        <!-- BOTÕES -->
                        <div class="d-flex justify-content-end gap-3 mt-5">

                            <a href="localizacoes.html" class="btn btn-outline-secondary">

                                Cancelar

                            </a>

                            <button type="submit" class="btn btn-primary-custom">

                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                Guardar Localização

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/1241375.js"></script>
</body>

</html>
