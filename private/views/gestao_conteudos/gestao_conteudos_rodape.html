<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Conteudos| TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="../equipamentos/equipamentos.html" class="nav-link">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="../localizacao/localizacao.html" class="nav-link">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="../garantias_contratos/garantias_contratos.html" class="nav-link">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link active">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>
        <main class="flex-grow-1 p-4">

            <div class="content-card">

                <!-- Cabeçalho -->
                <div class="d-flex justify-content-between align-items-start mb-4">

                    <div>

                        <h1 class="section-title-private mb-2">
                            Gestão do Rodapé
                        </h1>

                        <p class="section-subtitle-private mb-0">
                            Edita o conteúdo apresentado no rodapé da página pública.
                        </p>

                    </div>
                    <div class="d-flex gap-2">

                        <a href="../gestao_conteudos/gestao_conteudos.html" class="btn btn-outline-secondary">

                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Voltar
                        </a>

                        <a href="../../../public/index.html#footer" class="btn btn-outline-primary">

                            <i class="fa-solid fa-eye me-2"></i>
                            Ver na Página Pública
                        </a>

                    </div>

                </div>

                <!-- Conteúdo -->
                <div class="row g-4">

                    <!-- Logo -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Logo do rodapé
                        </label>

                        <input type="file" class="form-control" id="rodapeLogoInput" accept="image/*">

                    </div>


                    <!-- Texto -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Texto descritivo
                        </label>

                        <textarea class="form-control" rows="4" id="rodapeTexto"></textarea>

                    </div>


                    <!-- Localização -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Localização
                        </label>

                        <input type="text" class="form-control" id="rodapeLocalizacao">

                    </div>


                    <!-- Horário -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Horário
                        </label>

                        <input type="text" class="form-control" id="rodapeHorario">

                    </div>


                    <!-- Contactos -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">
                            Contactos
                        </label>

                        <input type="text" class="form-control" id="rodapeContactos">

                    </div>
                </div>
                <!-- Botão Guardar -->
                <div class="d-flex justify-content-center mt-5">

                    <button type="button" class="btn btn-primary-custom" id="btnGuardarRodape">

                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        Guardar Alterações

                    </button>

                </div>
            </div>

        </main>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="../../../assets/js/1241375.js"></script>
</body>

</html>
