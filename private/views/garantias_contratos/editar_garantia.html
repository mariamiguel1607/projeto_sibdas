<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../../../assets/bootstrap/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="../equipamentos/equipamentos.html" class="nav-link">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="../localizacao/localizacao.html" class="nav-link">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="garantias_contratos.html" class="nav-link active">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="private-main">

            <!-- TOPO -->
            <header class="private-topbar">

                <div>

                    <h1>Editar Garantia e Contrato</h1>

                    <p>
                        Atualização das informações de garantia e manutenção dos equipamentos médicos.
                    </p>

                </div>

            </header>


            <!-- FORMULÁRIO -->
            <section class="card form-card">

                <div class="card-body">

                    <form>

                        <div class="row g-4">

                            <!-- CÓDIGO -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Código
                                </label>

                                <input type="text" class="form-control" value="GAR-0001" readonly>

                            </div>

                            <!-- ESTADO -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Estado
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Ativo
                                    </option>

                                    <option>
                                        Expirado
                                    </option>

                                    <option>
                                        Pendente
                                    </option>

                                </select>

                            </div>

                            <!-- EQUIPAMENTO -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Equipamento Associado
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Ventilador Pulmonar
                                    </option>

                                    <option>
                                        Monitor Multiparamétrico
                                    </option>

                                    <option>
                                        Bomba de Infusão
                                    </option>

                                    <option>
                                        Desfibrilhador
                                    </option>

                                </select>

                            </div>


                            <!-- DATA INÍCIO -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Data de Início da Garantia
                                </label>

                                <input type="date" class="form-control" value="2025-01-01">

                            </div>

                            <!-- DATA FIM -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Data de Fim da Garantia
                                </label>

                                <input type="date" class="form-control" value="2027-01-01">

                            </div>


                            <!-- EXISTE CONTRATO -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Existe Contrato?
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Sim
                                    </option>

                                    <option>
                                        Não
                                    </option>

                                </select>

                            </div>

                            <!-- TIPO -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Tipo
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Manutenção Preventiva
                                    </option>

                                    <option>
                                        Manutenção Corretiva
                                    </option>

                                    <option>
                                        Calibração
                                    </option>

                                    <option>
                                        Garantia do Fabricante
                                    </option>

                                </select>

                            </div>

                            <!-- PERIODICIDADE -->
                            <div class="col-md-4">

                                <label class="form-label">
                                    Periodicidade
                                </label>

                                <select class="form-select">

                                    <option>
                                        Mensal
                                    </option>

                                    <option>
                                        Trimestral
                                    </option>

                                    <option selected>
                                        Semestral
                                    </option>

                                    <option>
                                        Anual
                                    </option>

                                </select>

                            </div>


                            <!-- ENTIDADE -->
                            <div class="col-md-12">

                                <label class="form-label">
                                    Entidade Responsável
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Dräger Portugal
                                    </option>

                                    <option>
                                        Philips Portugal
                                    </option>

                                    <option>
                                        MedEquip Portugal
                                    </option>

                                </select>

                            </div>


                            <!-- OBSERVAÇÕES -->
                            <div class="col-md-12">

                                <label class="form-label">
                                    Observações
                                </label>

                                <textarea class="form-control"
                                    rows="4">Contrato inclui manutenção preventiva e assistência técnica prioritária para equipamentos críticos.</textarea>

                            </div>

                        </div>


                        <!-- BOTÕES -->
                        <div class="d-flex justify-content-end gap-3 mt-4">

                            <a href="garantias_contratos.html" class="btn btn-outline-secondary">

                                Cancelar

                            </a>

                            <button type="submit" class="btn btn-primary-custom">

                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                Guardar Alterações

                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

    <!-- Bootstrap JS -->
    <script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script>
</body>

</html>
