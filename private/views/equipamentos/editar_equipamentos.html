<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamentos | TechMed Solutions</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="../../../assets/images/imagem_logo1-semfundo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../../../assets/bootstrap/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/1241375.css">
</head>

<body class="private-body">

    <div class="private-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar d-flex flex-column p-3">

            <div class="sidebar-logo text-center mb-4">
                <img src="../../../assets/images/imagem_logo1-semfundo.png" alt="Logo TechMed Solutions"
                    class="img-fluid">
            </div>

            <nav class="sidebar-menu nav nav-pills flex-column gap-2">
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="equipamentos.html" class="nav-link active">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Equipamentos
                </a>

                <a href="../localizacao/localizacao.html" class="nav-link">
                    <i class="fa-solid fa-location-dot"></i>
                    Localizações
                </a>

                <a href="../fornecedores/fornecedores.html" class="nav-link">
                    <i class="fa-solid fa-truck-medical"></i>
                    Fornecedores
                </a>

                <a href="../documentacao/documentacao.html" class="nav-link">
                    <i class="fa-solid fa-file-lines"></i>
                    Documentação
                </a>

                <a href="../garantias_contratos/garantias_contratos.html" class="nav-link">
                    <i class="fa-solid fa-file-signature"></i>
                    Garantias e Contratos
                </a>

                <a href="../gestao_conteudos/gestao_conteudos.html" class="nav-link">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Gestão de Conteúdos
                </a>
            </nav>

            <div class="sidebar-footer mt-auto">
                <a href="../../../public/index.html" class="nav-link">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Sair
                </a>
            </div>

        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1 p-4 p-lg-5">

            <!-- CABEÇALHO -->
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">

                <div>
                    <h1 class="fw-bold mb-1">Editar Equipamento</h1>
                    <p class="text-muted mb-0">
                        Atualização dos dados técnicos e administrativos do equipamento.
                    </p>
                </div>

                <div class="d-flex gap-2">
                    <a href="ficha_equipamento.html" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Voltar
                    </a>
                </div>

            </div>

            <!-- FORMULÁRIO -->
            <form>

                <!-- DADOS GERAIS -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">
                            <i class="fa-solid fa-circle-info me-2 text-primary"></i>
                            Dados gerais
                        </h4>

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label for="codigo" class="form-label fw-semibold">Código interno de inventário</label>
                                <input type="text" class="form-control" id="codigo" value="EQ-0001">
                            </div>

                            <div class="col-md-8">
                                <label for="designacao" class="form-label fw-semibold">Designação do equipamento</label>
                                <input type="text" class="form-control" id="designacao" value="Ventilador Pulmonar">
                            </div>

                            <div class="col-md-4">
                                <label for="categoria" class="form-label fw-semibold">Categoria</label>
                                <select id="categoria" class="form-select">
                                    <option>Diagnóstico</option>
                                    <option selected>Suporte de vida</option>
                                    <option>Monitorização</option>
                                    <option>Terapia</option>
                                    <option>Imagem médica</option>
                                    <option>Laboratório</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="fabricante" class="form-label fw-semibold">Fabricante</label>
                                <input type="text" class="form-control" id="fabricante" value="Philips">
                            </div>

                            <div class="col-md-4">
                                <label for="marcaModelo" class="form-label fw-semibold">Marca / Modelo</label>
                                <input type="text" class="form-control" id="marcaModelo" value="Philips VX-200">
                            </div>

                            <div class="col-md-4">
                                <label for="numeroSerie" class="form-label fw-semibold">Número de série</label>
                                <input type="text" class="form-control" id="numeroSerie" value="SN-2026-001">
                            </div>

                            <div class="col-md-4">
                                <label for="anoFabrico" class="form-label fw-semibold">Ano de fabrico</label>
                                <input type="number" class="form-control" id="anoFabrico" value="2023">
                            </div>

                            <div class="col-md-4">
                                <label for="criticidade" class="form-label fw-semibold">Criticidade</label>
                                <select id="criticidade" class="form-select">
                                    <option>Baixa</option>
                                    <option>Média</option>
                                    <option>Alta</option>
                                    <option selected>Crítica</option>
                                </select>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- AQUISIÇÃO -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">
                            <i class="fa-solid fa-file-invoice-dollar me-2 text-primary"></i>
                            Aquisição
                        </h4>

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label for="dataAquisicao" class="form-label fw-semibold">Data de aquisição</label>
                                <input type="date" class="form-control" id="dataAquisicao" value="2024-03-12">
                            </div>

                            <div class="col-md-4">
                                <label for="custoAquisicao" class="form-label fw-semibold">Custo de aquisição</label>
                                <input type="number" class="form-control" id="custoAquisicao" value="8500">
                            </div>

                            <div class="col-md-4">
                                <label for="tipoEntrada" class="form-label fw-semibold">Tipo de entrada</label>
                                <select id="tipoEntrada" class="form-select">
                                    <option selected>Compra</option>
                                    <option>Doação</option>
                                    <option>Aluguer</option>
                                    <option>Empréstimo</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="fornecedor" class="form-label fw-semibold">Fornecedor</label>
                                <select id="fornecedor" class="form-select">
                                    <option selected>MedEquip Portugal</option>
                                    <option>SaúdeTec Lda.</option>
                                    <option>HospitalCare Solutions</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="estadoAtual" class="form-label fw-semibold">Estado atual</label>
                                <select id="estadoAtual" class="form-select">
                                    <option selected>Ativo</option>
                                    <option>Inativo</option>
                                    <option>Em manutenção</option>
                                    <option>Em calibração</option>
                                    <option>Fora de serviço</option>
                                </select>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- LOCALIZAÇÃO -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">
                            <i class="fa-solid fa-location-dot me-2 text-primary"></i>
                            Localização
                        </h4>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="instituicao" class="form-label fw-semibold">Instituição</label>
                                <input type="text" class="form-control" id="instituicao" value="Hospital de São João">
                            </div>

                            <div class="col-md-6">
                                <label for="servico" class="form-label fw-semibold">Serviço</label>
                                <input type="text" class="form-control" id="servico"
                                    value="Unidade de Cuidados Intensivos">
                            </div>

                            <div class="col-md-4">
                                <label for="piso" class="form-label fw-semibold">Piso</label>
                                <input type="text" class="form-control" id="piso" value="Piso 2">
                            </div>

                            <div class="col-md-4">
                                <label for="sala" class="form-label fw-semibold">Sala</label>
                                <input type="text" class="form-control" id="sala" value="UCI-02">
                            </div>

                            <div class="col-md-4">
                                <label for="localizacaoDetalhe" class="form-label fw-semibold">Localização
                                    detalhada</label>
                                <input type="text" class="form-control" id="localizacaoDetalhe"
                                    value="Junto ao posto de enfermagem">
                            </div>

                        </div>

                    </div>
                </div>

                <!-- MANUTENÇÃO -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">
                            <i class="fa-solid fa-screwdriver-wrench me-2 text-primary"></i>
                            Manutenção e calibração
                        </h4>

                        <div class="row g-3">

                            <div class="col-md-3">
                                <label for="ultimaManutencao" class="form-label fw-semibold">Última manutenção</label>
                                <input type="date" class="form-control" id="ultimaManutencao" value="2026-01-15">
                            </div>

                            <div class="col-md-3">
                                <label for="proximaManutencao" class="form-label fw-semibold">Próxima manutenção</label>
                                <input type="date" class="form-control" id="proximaManutencao" value="2026-07-15">
                            </div>

                            <div class="col-md-3">
                                <label for="ultimaCalibracao" class="form-label fw-semibold">Última calibração</label>
                                <input type="date" class="form-control" id="ultimaCalibracao" value="2026-01-20">
                            </div>

                            <div class="col-md-3">
                                <label for="estadoTecnico" class="form-label fw-semibold">Estado técnico</label>
                                <select id="estadoTecnico" class="form-select">
                                    <option selected>Operacional</option>
                                    <option>Necessita manutenção</option>
                                    <option>Aguardar calibração</option>
                                    <option>Fora de serviço</option>
                                </select>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- OBSERVAÇÕES -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">
                            <i class="fa-solid fa-note-sticky me-2 text-primary"></i>
                            Observações
                        </h4>

                        <textarea class="form-control"
                            rows="4">Equipamento em funcionamento regular. Deve ser dada prioridade à manutenção preventiva devido à sua criticidade no serviço onde se encontra instalado.</textarea>

                    </div>
                </div>

                <!-- BOTÕES -->
                <div class="d-flex justify-content-end gap-2 mb-4">

                    <a href="ficha_equipamento.html" class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        Guardar Alterações
                    </button>

                </div>

            </form>

        </main>

    </div>

    <script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script>

</body>

</html>
